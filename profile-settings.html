<body data-active="settings" data-highlights-page="settings">
  <div data-header></div><main class="container layout"><aside data-sidebar></aside><section class="content">
    <div class="page-head page-head--plain"><h1 class="page-head__title">Профиль</h1></div>
    <section class="panel cm-settings-panel"><div class="panel__head"><div><h2 class="panel__title">Адрес вашего профиля <span class="pro-badge">PRO</span></h2><p class="panel__subtitle">Используйте никнейм вместо числового ID в ссылке на свой профиль.</p></div></div>
